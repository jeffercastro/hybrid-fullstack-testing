name: Hybrid Full-Stack Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Hybrid Tests (API + UI + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdet_user
          POSTGRES_PASSWORD: sdet_password
          POSTGRES_DB: sdet_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Initialize PostgreSQL Schema
        env:
          PGPASSWORD: sdet_password
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U sdet_user -d sdet_test_db -f src/db/migrations/init.sql

      - name: Run Hybrid Test Suite
        env:
          DATABASE_URL: postgresql://sdet_user:sdet_password@localhost:5432/sdet_test_db
        run: npx playwright test

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-hybrid-report
          path: playwright-report/
          retention-days: 14
