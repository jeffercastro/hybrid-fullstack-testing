version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: test_postgres_db
    environment:
      POSTGRES_USER: sdet_user
      POSTGRES_PASSWORD: sdet_password
      POSTGRES_DB: sdet_test_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
